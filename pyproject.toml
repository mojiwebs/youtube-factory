[project]
name = "youtube-factory"
version = "0.1.0"
description = "Multi-agent YouTube content factory for Little Letter Lane and Ledger & Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "openai>=3.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
